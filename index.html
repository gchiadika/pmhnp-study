<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Capture only in memory and scrub before resources or application startup.
      (() => { try { if (new URLSearchParams(location.hash.slice(1)).has('sync')) {
        const fragment = location.hash;
        history.replaceState(history.state, '', location.pathname + location.search);
        window.__pmhnpSyncFragment = fragment;
      }} catch (_) { window.__pmhnpSyncScrubFailed = true; } })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6bcb" />
